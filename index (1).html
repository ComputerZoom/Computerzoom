            const variants = {
                default: "bg-blue-600 text-white hover:bg-blue-700 shadow-lg hover:shadow-xl hover:-translate-y-0.5",
                outline: "border-2 border-blue-600 text-blue-600 hover:bg-blue-50 bg-transparent",
                ghost: "hover:bg-gray-100 text-gray-700",
                white: "bg-white text-blue-600 hover:bg-blue-50 shadow-lg"
            };
            
            const sizes = {
                default: "px-6 py-3 text-base",
                sm: "px-4 py-2 text-sm",
                lg: "px-8 py-4 text-lg",
                icon: "w-12 h-12 p-0"
            };
            
            return (
                <button type={type} onClick={onClick} className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}>
                    {children}
                </button>
            );
        };
